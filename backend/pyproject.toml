[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-manager-backend"
version = "0.1.0"
description = "Local multi-agent compliance platform — backend"
requires-python = ">=3.11"
readme = "../README.md"
license = { text = "Proprietary" }

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "websockets>=13",

    # data
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",  # sync driver Alembic uses for migrations
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "redis>=5.2",

    # agents / llm
    "langgraph>=0.2.50",
    "httpx>=0.27",
    "tiktoken>=0.8",

    # ingestion
    "watchdog>=5",
    "pytesseract>=0.3.13",
    "pypdf>=5",
    "python-docx>=1.1",
    "pysbd>=0.3.4",
    "pillow>=11",

    # security / auth
    "passlib[bcrypt]>=1.7",
    "pyjwt>=2.10",

    # scheduling
    "apscheduler>=3.10",

    # config
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-passlib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RET", "SIM"]
ignore = ["S101"]  # assert allowed in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
